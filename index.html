<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация Google</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f7f6; }
        .container { max-width: 450px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input, button { width: 100%; padding: 10px; margin: 6px 0; box-sizing: border-box; border-radius: 4px; border: 1px solid #ccc; }
        button { color: white; border: none; font-weight: bold; cursor: pointer; }
        #saveBtn { background-color: #28a745; }
        #loginGoogleBtn { background-color: #4285F4; }  /* Google */
        #logoutBtn { background-color: #dc3545; width: auto; padding: 5px 10px; margin: 0; }
        .btn-group { display: flex; gap: 5px; }
        .btn-group button { width: auto; padding: 5px 10px; font-size: 14px; margin: 0; }
        .edit-btn { background-color: #ffc107; color: black; }
        .delete-btn { background-color: #dc3545; }
        ul { list-style-type: none; padding: 0; margin-top: 20px; }
        li { padding: 10px; background: #f9f9f9; margin-bottom: 8px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; border-left: 5px solid #007bff; }
    </style>
</head>
<body>

<div class="container">
    <!-- БЛОК ВХОДА -->
    <div id="authSection" style="display: block; text-align: center;">
        <h2>Вход в систему</h2>
        <p>Выберите способ входа:</p>
        <button id="loginGoogleBtn">Войти через Google</button>
    </div>

    <!-- БЛОК ПРИЛОЖЕНИЯ -->
    <div id="appSection" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h2 id="formTitle" style="margin: 0;">Добавить предмет</h2>
            <button id="logoutBtn">Выйти</button>
        </div>
        <input type="text" id="subjectName" placeholder="Название предмета">
        <input type="date" id="subjectDate">
        <button id="saveBtn">Сохранить</button>

        <h2>Список предметов:</h2>
        <ul id="subjectsList"></ul>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, push, update, remove, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAJ67EfNDNQcIUE13J7lPrQUc3O-wOLGPs",
        authDomain: "test-nov-6347a.firebaseapp.com",
        projectId: "test-nov-6347a",
        storageBucket: "test-nov-6347a.firebasestorage.app",
        messagingSenderId: "210320564676",
        appId: "1:210320564676:web:9eca0846cbdba83054c491",
        databaseURL: "https://test-nov-6347a-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    const googleProvider = new GoogleAuthProvider();
    const subjectsRef = ref(db, "subjects");

    const authSection = document.getElementById("authSection");
    const appSection = document.getElementById("appSection");
    const loginGoogleBtn = document.getElementById("loginGoogleBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const nameInput = document.getElementById("subjectName");
    const dateInput = document.getElementById("subjectDate");
    const saveBtn = document.getElementById("saveBtn");
    const formTitle = document.getElementById("formTitle");
    const list = document.getElementById("subjectsList");

    let editingKey = null;
    let unsubscribeDB = null;

    // Вход через Google
    loginGoogleBtn.addEventListener("click", () => {
        signInWithPopup(auth, googleProvider).catch(err => alert("Ошибка Google: " + err.message));
    });

    logoutBtn.addEventListener("click", () => {
        signOut(auth).catch(err => console.error(err));
    });

    // Состояние авторизации
    onAuthStateChanged(auth, (user) => {
        if (user) {
            authSection.style.display = "none";
            appSection.style.display = "block";
            startListeningDB();
        } else {
            authSection.style.display = "block";
            appSection.style.display = "none";
            stopListeningDB();
        }
    });

    function startListeningDB() {
        unsubscribeDB = onValue(subjectsRef, (snapshot) => {
            list.innerHTML = "";
            const data = snapshot.val();
            if (data) {
                Object.entries(data).forEach(([key, item]) => {
                    const li = document.createElement("li");
                    li.innerHTML = `<span><strong>${item.name}</strong> (${item.date})</span>`;

                    const btnGroup = document.createElement("div");
                    btnGroup.className = "btn-group";

                    const editBtn = document.createElement("button");
                    editBtn.textContent = "✎";
                    editBtn.className = "edit-btn";
                    editBtn.onclick = () => {
                        editingKey = key;
                        nameInput.value = item.name;
                        dateInput.value = item.date;
                        saveBtn.textContent = "Изменить";
                        formTitle.textContent = "Редактирование";
                    };

                    const deleteBtn = document.createElement("button");
                    deleteBtn.textContent = "🗑";
                    deleteBtn.className = "delete-btn";
                    deleteBtn.onclick = () => {
                        if (confirm("Удалить предмет?")) {
                            remove(ref(db, `subjects/${key}`));
                        }
                    };

                    btnGroup.appendChild(editBtn);
                    btnGroup.appendChild(deleteBtn);
                    li.appendChild(btnGroup);
                    list.appendChild(li);
                });
            } else {
                list.innerHTML = "<li>Список пуст</li>";
            }
        });
    }

    function stopListeningDB() {
        if (unsubscribeDB) {
            unsubscribeDB();
            unsubscribeDB = null;
        }
        list.innerHTML = "";
    }

    saveBtn.addEventListener("click", () => {
        const name = nameInput.value.trim();
        const date = dateInput.value;

        if (!name || !date) return alert("Заполните поля!");

        if (editingKey) {
            update(ref(db, `subjects/${editingKey}`), { name, date }).then(() => resetForm());
        } else {
            push(subjectsRef, { name, date }).then(() => resetForm());
        }
    });

    function resetForm() {
        nameInput.value = "";
        dateInput.value = "";
        editingKey = null;
        saveBtn.textContent = "Сохранить";
        formTitle.textContent = "Добавить предмет";
    }
</script>

</body>
</html>
